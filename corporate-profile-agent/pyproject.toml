[project]
name = "corporate-profile-agent"
version = "0.1.0"
description = "Audited corporate profiles for Latin American companies"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.109",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
pdf = [
    "pdfplumber>=0.11",
    "pytesseract>=0.3.13",   # also requires tesseract-ocr + spa/por tessdata
]
dev = [
    "pytest>=8",
]

[project.scripts]
corporate-profile-agent = "corporate_profile_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
